location = /colombia { return 302 /colombia/; }
location = /colombia/api/consultant/speech {
        limit_req zone=colombia_voice burst=4 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
        proxy_read_timeout 35s;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8024/api/consultant/speech;
}
location = /colombia/api/ai/chat {
        limit_req zone=colombia_voice burst=4 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
        proxy_read_timeout 35s;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8024/api/ai/chat;
}
location ^~ /colombia/api/ {
        limit_req zone=colombia_api burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
        proxy_read_timeout 35s;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8024/api/;
}
location /colombia/ {
        alias /opt/colombia-exam/current/frontend/public/;
        index index.html;
}
