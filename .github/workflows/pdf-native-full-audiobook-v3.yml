name: PDF native RU-ES full audiobook v3

on:
  workflow_dispatch:
  push:
    branches:
      - audio/pdf-native-full-20260814
    paths:
      - '.pdf-native-audio-v3-trigger'
      - '.github/workflows/pdf-native-full-audiobook-v3.yml'
      - 'scripts/build_pdf_audio.py'
      - 'pdf_payload_v2/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural TTS tools
        run: pip install -q edge-tts imageio-ffmpeg
      - name: Restore exact text extracted from PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          src=Path('pdf_payload_v2')
          out=Path('/tmp/pdf_audio_texts')
          out.mkdir(parents=True,exist_ok=True)

          specs={
            '01_geography': {'min':18000, 'encoded':None},
            '02_history': {'min':60000, 'encoded':42064},
            '03_constitution': {'min':47000, 'encoded':27792},
            '04_spanish_bilingual': {'min':60000, 'encoded':39336},
          }

          for name,spec in specs.items():
              parts=sorted(src.glob(f'{name}.gz.b64.part*'))
              payload=''.join(p.read_text(encoding='ascii').strip() for p in parts)
              single=src/f'{name}.gz.b64'

              if spec['encoded'] is None:
                  if not payload:
                      payload=single.read_text(encoding='ascii').strip()
              else:
                  need=spec['encoded']-len(payload)
                  if need>0:
                      # Earlier one-file upload retained a valid suffix even when its middle
                      # was damaged. Exact split parts are authoritative; use only the missing tail.
                      if not single.exists():
                          raise SystemExit(f'{name}: missing {need} encoded chars and no fallback single payload')
                      fullish=single.read_text(encoding='ascii').strip()
                      if len(fullish)<need:
                          raise SystemExit(f'{name}: fallback payload too short for missing tail')
                      payload += fullish[-need:]
                  if len(payload)!=spec['encoded']:
                      raise SystemExit(f'{name}: encoded length {len(payload)} != {spec["encoded"]}')

              try:
                  raw=base64.b64decode(payload, validate=True)
                  text=gzip.decompress(raw).decode('utf-8')
              except Exception as exc:
                  raise SystemExit(f'{name}: decode/decompress failed: {exc}')
              if len(text)<spec['min']:
                  raise SystemExit(f'{name}: restored text too short: {len(text)}')
              (out/f'{name}.txt').write_text(text,encoding='utf-8')
              print(name,'parts=',len(parts),'payload_chars=',len(payload),'chars=',len(text),'bytes=',len(text.encode('utf-8')))
          PY
      - name: Render audiobook with native RU and Colombian ES voices
        run: python scripts/build_pdf_audio.py
      - name: Validate final MP3
        shell: bash
        run: |
          set -euo pipefail
          test -s uchebnoe_posobie_kolumbiya_RU_ES_native_full.mp3
          test $(stat -c%s uchebnoe_posobie_kolumbiya_RU_ES_native_full.mp3) -gt 20000000
          ls -lh uchebnoe_posobie_kolumbiya_RU_ES_native_full.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: full-audiobook-pdf-native-ru-es-v3
          path: uchebnoe_posobie_kolumbiya_RU_ES_native_full.mp3
          if-no-files-found: error
          retention-days: 30
