name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Python syntax check
        run: python -m py_compile backend/main.py scripts/report_db_encoding.py scripts/audit_db.py scripts/smoke_test.py

      - name: Database audit
        run: python scripts/audit_db.py

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../backend-smoke.out.log 2> ../backend-smoke.err.log &
          echo $! > ../backend-smoke.pid

      - name: Start static frontend
        working-directory: frontend/public
        run: |
          python -m http.server 5173 --bind 127.0.0.1 > ../../frontend-smoke.out.log 2> ../../frontend-smoke.err.log &
          echo $! > ../../frontend-smoke.pid

      - name: Wait for services
        run: |
          python - <<'PY'
          import time
          from urllib import request

          for url in ("http://127.0.0.1:8000/api/health", "http://127.0.0.1:5173/"):
              deadline = time.time() + 25
              while time.time() < deadline:
                  try:
                      with request.urlopen(url, timeout=2) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.5)
              else:
                  raise SystemExit(f"Timed out waiting for {url}")
          PY

      - name: Runtime smoke test
        run: python scripts/smoke_test.py

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "Backend stderr"
          cat backend-smoke.err.log || true
          echo "Frontend stderr"
          cat frontend-smoke.err.log || true

      - name: Stop services
        if: always()
        run: |
          kill "$(cat backend-smoke.pid)" 2>/dev/null || true
          kill "$(cat frontend-smoke.pid)" 2>/dev/null || true
