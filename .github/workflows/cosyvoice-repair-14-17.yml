name: CosyVoice3 repair 14 17

on:
  workflow_dispatch:
  push:
    branches:
      - audio/pdf-native-full-20260814
    paths:
      - .github/workflows/cosyvoice-repair-14-17.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build repair plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/cosy_full_parallel.py')
          s = p.read_text(encoding='utf-8')
          start = "    digest = hashlib.sha256(payload.encode('ascii')).hexdigest()\n"
          end = "    text = gzip.decompress(base64.b64decode(payload, validate=True)).decode('utf-8')\n"
          a = s.index(start)
          b = s.index(end, a)
          s = s[:a] + s[b:]
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/cosy_full_parallel.py prepare --out /tmp/cosy_plan.json --shards 20
      - uses: actions/upload-artifact@v4
        with:
          name: cosy-repair-plan
          path: /tmp/cosy_plan.json
          if-no-files-found: error
          retention-days: 7

  repair:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 14
          - 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: cosy-repair-plan
          path: /tmp/plan
      - name: Patch zero-length handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/cosy_full_parallel.py')
          s = p.read_text(encoding='utf-8')
          old = """        outs = []
        for item in model.inference_zero_shot(txt, full, ref, zero_shot_spk_id=sid, stream=False, speed=0.92):
            outs.append(item['tts_speech'].cpu())
        if not outs:
            raise RuntimeError(f'No audio for segment {seg[\"index\"]}')
        audio = torch.cat(outs, dim=1)
"""
          new = """        if not re.search(r'[0-9A-Za-zА-Яа-яЁёÁÉÍÓÚÜÑáéíóúüñ]', txt):
            audio = silence(0.35)
            pieces.append(audio)
            if seg.get('pause_after', 0) > 0:
                pieces.append(silence(float(seg['pause_after'])))
            print(f'SHARD {shard} SEG {k}/{len(segs)} idx={seg[\"index\"]} placeholder=silence', flush=True)
            continue
        outs = []
        audio = None
        try:
            for item in model.inference_zero_shot(txt, full, ref, zero_shot_spk_id=sid, stream=False, speed=0.92, text_frontend=False):
                outs.append(item['tts_speech'].cpu())
            if outs:
                audio = torch.cat(outs, dim=1)
        except RuntimeError as exc:
            if 'Input and output sizes should be greater than 0' not in str(exc):
                raise
            print(f'COSY_ZERO_LENGTH idx={seg[\"index\"]} text={txt!r}', flush=True)
        if audio is None or audio.numel() == 0 or audio.shape[1] < int(0.08 * model.sample_rate):
            import edge_tts
            voice = 'ru-RU-DmitryNeural' if lang == 'ru' else 'es-CO-GonzaloNeural'
            mp3 = work / f'fallback_{shard}_{seg[\"index\"]}.mp3'
            wav = work / f'fallback_{shard}_{seg[\"index\"]}.wav'
            async def fallback():
                await edge_tts.Communicate(txt, voice, rate='-8%').save(str(mp3))
            asyncio.run(fallback())
            subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(mp3),'-ar',str(model.sample_rate),'-ac','1','-c:a','pcm_s16le',str(wav)], check=True)
            audio, sr = torchaudio.load(str(wav))
            if sr != model.sample_rate:
                audio = torchaudio.functional.resample(audio, sr, model.sample_rate)
            if audio.numel() == 0 or audio.shape[1] == 0:
                raise RuntimeError(f'Fallback produced no audio for segment {seg[\"index\"]}')
            print(f'EDGE_FALLBACK idx={seg[\"index\"]} lang={lang} chars={len(txt)}', flush=True)
"""
          if old not in s:
              raise SystemExit('render block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-dev ffmpeg
      - name: Clone CosyVoice
        run: git clone --depth 1 --recursive https://github.com/QwenAudio/CosyVoice.git /tmp/CosyVoice
      - name: Install CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade 'pip<26' 'setuptools<81' wheel
          pip install -q torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          cd /tmp/CosyVoice
          grep -vE '^(--extra-index-url|deepspeed|onnxruntime-gpu|tensorrt-cu12|openai-whisper)' requirements.txt > /tmp/cosy-req.txt
          pip install -q -r /tmp/cosy-req.txt
          pip install -q onnxruntime==1.18.0 huggingface_hub edge-tts
          pip install -q --no-build-isolation openai-whisper==20231117
      - name: Download CosyVoice3 model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('FunAudioLLM/Fun-CosyVoice3-0.5B-2512', local_dir='/tmp/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B')
          PY
      - name: Render repaired shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/render
          python scripts/cosy_full_parallel.py render --plan /tmp/plan/cosy_plan.json --shard ${{ matrix.shard }} --model-dir /tmp/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B --out /tmp/render/shard_${{ matrix.shard }}.wav
          ffmpeg -y -loglevel error -i /tmp/render/shard_${{ matrix.shard }}.wav -ar 24000 -ac 1 -c:a libmp3lame -b:a 96k /tmp/render/shard_${{ matrix.shard }}.mp3
          test $(stat -c%s /tmp/render/shard_${{ matrix.shard }}.mp3) -gt 100000
      - uses: actions/upload-artifact@v4
        with:
          name: cosy-repair-shard-${{ matrix.shard }}
          path: /tmp/render/shard_${{ matrix.shard }}.mp3
          if-no-files-found: error
          retention-days: 7
