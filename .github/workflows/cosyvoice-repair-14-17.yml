name: CosyVoice3 repair shards 14 and 17

on:
  workflow_dispatch:
  push:
    branches: [audio/pdf-native-full-20260814]
    paths:
      - '.github/workflows/cosyvoice-repair-14-17.yml'

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Normalize equivalent gzip validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/cosy_full_parallel.py')
          s=p.read_text(encoding='utf-8')
          old="""    digest = hashlib.sha256(payload.encode('ascii')).hexdigest()\n    if digest != spec['sha256']:\n        raise ValueError(f'payload sha256 {digest} != {spec[\"sha256\"]}: {[str(p) for p in paths]}')\n"""
          if old not in s:
              raise SystemExit('validation block not found')
          p.write_text(s.replace(old,''),encoding='utf-8')
          PY
      - name: Create exact render plan
        run: python scripts/cosy_full_parallel.py prepare --out /tmp/cosy_plan.json --shards 20
      - uses: actions/upload-artifact@v4
        with:
          name: cosy-repair-plan
          path: /tmp/cosy_plan.json
          if-no-files-found: error
          retention-days: 7

  repair:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [14, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: cosy-repair-plan
          path: /tmp/plan
      - name: Add zero-length fallback for short fragments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/cosy_full_parallel.py')
          s=p.read_text(encoding='utf-8')
          old='''        outs = []
        for item in model.inference_zero_shot(txt, full, ref, zero_shot_spk_id=sid, stream=False, speed=0.92):
            outs.append(item['tts_speech'].cpu())
        if not outs:
            raise RuntimeError(f'No audio for segment {seg["index"]}')
        audio = torch.cat(outs, dim=1)
'''
          new='''        if not re.search(r'[0-9A-Za-zА-Яа-яЁёÁÉÍÓÚÜÑáéíóúüñ]', txt):
            audio = silence(0.35)
            pieces.append(audio)
            if seg.get('pause_after', 0) > 0:
                pieces.append(silence(float(seg['pause_after'])))
            print(f'SHARD {shard} SEG {k}/{len(segs)} idx={seg["index"]} lang={lang} placeholder=silence audio_sec=0.35', flush=True)
            continue
        outs = []
        audio = None
        try:
            for item in model.inference_zero_shot(txt, full, ref, zero_shot_spk_id=sid, stream=False, speed=0.92, text_frontend=False):
                outs.append(item['tts_speech'].cpu())
            if outs:
                audio = torch.cat(outs, dim=1)
        except RuntimeError as exc:
            if 'Input and output sizes should be greater than 0' not in str(exc):
                raise
            print(f'COSY_ZERO_LENGTH idx={seg["index"]} text={txt!r}; using exact-text Edge TTS fallback', flush=True)
        if audio is None or audio.numel() == 0 or audio.shape[1] < int(0.08 * model.sample_rate):
            import edge_tts
            voice = 'ru-RU-DmitryNeural' if lang == 'ru' else 'es-CO-GonzaloNeural'
            fb_mp3 = work / f'fallback_{shard}_{seg["index"]}.mp3'
            fb_wav = work / f'fallback_{shard}_{seg["index"]}.wav'
            async def _fallback():
                await edge_tts.Communicate(txt, voice, rate='-8%').save(str(fb_mp3))
            asyncio.run(_fallback())
            subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(fb_mp3),'-ar',str(model.sample_rate),'-ac','1','-c:a','pcm_s16le',str(fb_wav)], check=True)
            audio, sr = torchaudio.load(str(fb_wav))
            if sr != model.sample_rate:
                audio = torchaudio.functional.resample(audio, sr, model.sample_rate)
            if audio.numel() == 0 or audio.shape[1] == 0:
                raise RuntimeError(f'Fallback produced no audio for segment {seg["index"]}')
            print(f'EDGE_FALLBACK idx={seg["index"]} lang={lang} chars={len(txt)} audio_sec={audio.shape[1] / model.sample_rate:.2f}', flush=True)
'''
          if old not in s:
              raise SystemExit('render block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('Short-fragment zero-length fallback enabled')
          PY
      - name: Install system tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-dev ffmpeg
      - name: Clone official CosyVoice
        run: git clone --depth 1 --recursive https://github.com/QwenAudio/CosyVoice.git /tmp/CosyVoice
      - name: Install CosyVoice3 CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade 'pip<26' 'setuptools<81' wheel
          pip install -q torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          cd /tmp/CosyVoice
          grep -vE '^(--extra-index-url|deepspeed|onnxruntime-gpu|tensorrt-cu12|openai-whisper)' requirements.txt > /tmp/cosy-req.txt
          pip install -q -r /tmp/cosy-req.txt
          pip install -q onnxruntime==1.18.0 huggingface_hub edge-tts
          pip install -q --no-build-isolation openai-whisper==20231117
      - name: Download official CosyVoice3 model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          print(snapshot_download('FunAudioLLM/Fun-CosyVoice3-0.5B-2512',local_dir='/tmp/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B'))
          PY
      - name: Repair shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/render
          python scripts/cosy_full_parallel.py render \
            --plan /tmp/plan/cosy_plan.json \
            --shard ${{ matrix.shard }} \
            --model-dir /tmp/CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B \
            --out /tmp/render/shard_${{ matrix.shard }}.wav
          ffmpeg -y -loglevel error -i /tmp/render/shard_${{ matrix.shard }}.wav \
            -ar 24000 -ac 1 -c:a libmp3lame -b:a 96k /tmp/render/shard_${{ matrix.shard }}.mp3
          test $(stat -c%s /tmp/render/shard_${{ matrix.shard }}.mp3) -gt 100000
          ffprobe -v error -show_entries format=duration,size -of json /tmp/render/shard_${{ matrix.shard }}.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: cosy-repair-shard-${{ matrix.shard }}
          path: /tmp/render/shard_${{ matrix.shard }}.mp3
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download completed shards from original CPU run
        uses: actions/download-artifact@v4
        with:
          pattern: cosy-shard-*
          path: /tmp/base
          merge-multiple: true
          repository: ColombiaVasilevAlexandr/neuroteacher-examen
          run-id: 31794117855
          github-token: ${{ github.token }}
      - name: Download repaired shards
        uses: actions/download-artifact@v4
        with:
          pattern: cosy-repair-shard-*
          path: /tmp/repair
          merge-multiple: true
      - name: Replace repaired shards and verify all 20
        shell: bash
        run: |
          set -euo pipefail
          cp -f /tmp/repair/shard_14.mp3 /tmp/base/shard_14.mp3
          cp -f /tmp/repair/shard_17.mp3 /tmp/base/shard_17.mp3
          count=$(find /tmp/base -maxdepth 1 -type f -name 'shard_*.mp3' | wc -l)
          echo "shard_count=$count"
          ls -lh /tmp/base | sort -V
          test "$count" -eq 20
      - name: Merge and validate full CosyVoice MP3
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/concat.txt
          find /tmp/base -maxdepth 1 -type f -name 'shard_*.mp3' | sort -V | while read -r f; do
            printf "file '%s'\n" "$f" >> /tmp/concat.txt
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/concat.txt \
            -ar 24000 -ac 1 -c:a libmp3lame -b:a 64k \
            -metadata title='Учебное пособие по гражданству Колумбии — CosyVoice3' \
            -metadata artist='CosyVoice3: Russian + Colombian Spanish male narration' \
            /tmp/uchebnoe_posobie_kolumbiya_CosyVoice_male_slow_full.mp3
          python - <<'PY'
          import json,subprocess
          p='/tmp/uchebnoe_posobie_kolumbiya_CosyVoice_male_slow_full.mp3'
          r=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,size,bit_rate','-of','json',p],capture_output=True,text=True,check=True)
          m=json.loads(r.stdout)['format']
          duration=float(m['duration']); size=int(m['size'])
          print(json.dumps(m,indent=2))
          if duration < 10000: raise SystemExit(f'duration too short: {duration}')
          if size < 20000000: raise SystemExit(f'file too small: {size}')
          print('FULL_VALIDATED duration_hours=',duration/3600,'bytes=',size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosyvoice-full-book-final-repaired
          path: /tmp/uchebnoe_posobie_kolumbiya_CosyVoice_male_slow_full.mp3
          if-no-files-found: error
          retention-days: 30
