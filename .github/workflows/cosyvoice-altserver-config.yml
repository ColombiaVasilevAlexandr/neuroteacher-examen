name: CosyVoice alternate server config

on:
  push:
    branches: [audio/pdf-native-full-20260814]
    paths: ['.github/workflows/cosyvoice-altserver-config.yml']
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependency
        run: pip install -q requests
      - name: Read Gradio config
        run: |
          python - <<'PY'
          import requests, json
          u='https://originalmmd-cosyvoice3-voicestudio.hf.space/config'
          r=requests.get(u,timeout=30); print('status',r.status_code,'len',len(r.text)); r.raise_for_status(); j=r.json()
          comps={c['id']:c for c in j.get('components',[])}
          for cid in [5,6,7,8,9,11,15,16,17,18,20]:
              c=comps.get(cid,{})
              print('COMP',cid,json.dumps({'type':c.get('type'),'props':c.get('props'),'api_info':c.get('api_info')},ensure_ascii=False)[:12000])
          for d in j.get('dependencies',[]):
              if d.get('api_name'):
                  print('DEP',json.dumps({k:d.get(k) for k in ['id','api_name','inputs','outputs','queue','show_api']},ensure_ascii=False))
          PY
