name: CosyVoice recentech probe

on:
  push:
    branches: [audio/pdf-native-full-20260814]
    paths: ['.github/workflows/cosyvoice-recentech-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q gradio_client edge-tts imageio-ffmpeg
      - name: Synthesize CosyVoice test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio,os,subprocess
          import edge_tts,imageio_ffmpeg
          from gradio_client import Client,handle_file
          prompt='Добрый день. Это спокойный мужской голос для учебной аудиокниги о Колумбии.'
          async def make(): await edge_tts.Communicate(prompt,'ru-RU-DmitryNeural',rate='-8%').save('/tmp/ref.mp3')
          asyncio.run(make())
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([ff,'-y','-i','/tmp/ref.mp3','-ar','24000','-ac','1','-c:a','pcm_s16le','/tmp/ref.wav'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          c=Client('recentechstudio/CosyVoice3',verbose=True)
          print(c.view_api())
          text='Колумбия расположена на северо-западе Южной Америки. Столица страны — Богота.'
          r=c.predict(text,handle_file('/tmp/ref.wav'),api_name='/tts_speak')
          print('RESULT',repr(r))
          # find first returned local audio path
          vals=r if isinstance(r,(tuple,list)) else [r]
          src=None
          for v in vals:
              if isinstance(v,str) and os.path.exists(v): src=v; break
              if isinstance(v,dict):
                  p=v.get('path') or v.get('name')
                  if p and os.path.exists(p): src=p; break
          if not src: raise RuntimeError(f'No audio file in result: {r!r}')
          subprocess.run([ff,'-y','-i',src,'-filter:a','atempo=0.92','-c:a','libmp3lame','-b:a','128k','/tmp/recentech_probe.mp3'],check=True)
          print('MP3_BYTES',os.path.getsize('/tmp/recentech_probe.mp3'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosyvoice-recentech-probe
          path: /tmp/recentech_probe.mp3
          if-no-files-found: error
